name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The job runs third-party code (the skills-ref validator and the packages it
# pulls from PyPI) with the workflow token in its environment. Nothing here
# writes to the repository, so the token is held to read access instead of
# whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the validator's own tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/ -v

      - name: Validate this repository's conventions
        run: python scripts/validate.py

      # The reference validator is the Agent Skills project's own skills-ref,
      # installed from that project's repository at a fixed commit, so the code
      # that runs is traceable to its source and an upstream change cannot alter
      # what CI means.
      # Upstream labels it a demonstration library; here it only checks our files
      # and is never shipped.
      - name: Install the Agent Skills reference validator
        run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref"

      # The reference validator checks the published Agent Skills specification;
      # scripts/validate.py checks the conventions this repository adds on top.
      - name: Validate skills against the Agent Skills reference validator
        run: |
          for skill in skills/*/; do
            echo "== $skill"
            skills-ref validate "$skill"
          done
