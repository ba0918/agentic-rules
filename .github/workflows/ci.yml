name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The job runs a third-party npm package (npx skills-ref) with the workflow token
# in its environment. Nothing here writes to the repository, so the token is held
# to read access instead of whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the validator's own tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/ -v

      - name: Validate this repository's conventions
        run: python scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The reference validator checks the published Agent Skills specification;
      # scripts/validate.py checks the conventions this repository adds on top.
      # The version is pinned so a release of the validator cannot change what CI means.
      - name: Validate skills against the Agent Skills reference validator
        run: |
          for skill in skills/*/; do
            echo "== $skill"
            npx --yes skills-ref@0.1.5 validate "$skill"
          done
